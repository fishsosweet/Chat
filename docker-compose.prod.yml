services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      API_PREFIX: /api/v1
      APP_NAME: ChatRealtime API
      LOG_LEVEL: info
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_ENABLE: ${REDIS_ENABLE}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      RTC_ICE_SERVERS: ${RTC_ICE_SERVERS}
      RTC_TURN_USERNAME: ${RTC_TURN_USERNAME}
      RTC_TURN_CREDENTIAL: ${RTC_TURN_CREDENTIAL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EMAIL_VERIFY_SECRET: ${JWT_EMAIL_VERIFY_SECRET}
      JWT_RESET_PASSWORD_SECRET: ${JWT_RESET_PASSWORD_SECRET}

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        CLIENT_VITE_API_BASE_URL: ${CLIENT_VITE_API_BASE_URL}
        CLIENT_VITE_SOCKET_URL: ${CLIENT_VITE_SOCKET_URL}
        ADMIN_VITE_API_BASE_URL: ${ADMIN_VITE_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
